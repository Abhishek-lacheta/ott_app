name: ott_app
description: "A short video feed application built with Clean Architecture and BLoC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  equatable: ^3.0.0
  cached_network_image: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
